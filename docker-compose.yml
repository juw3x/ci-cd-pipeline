version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  api-test:
    build: .
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=test
    command: pytest tests/ -v
    volumes:
      - ./tests:/app/tests
      - ./app:/app/app

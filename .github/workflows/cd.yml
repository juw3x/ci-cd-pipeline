name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-api:latest
            ${{ secrets.DOCKER_USERNAME }}/devops-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Здесь должен быть реальный деплой (например, kubectl apply, docker-compose up, etc.)
          # Для демо просто выводим сообщение
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/devops-api:${{ github.sha }}"
          echo "Environment: staging"

      - name: Health check
        run: |
          echo "Running health checks on staging..."
          # curl -f https://staging.example.com/health || exit 1

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/devops-api:${{ github.sha }}"
          echo "Environment: production"

      - name: Health check
        run: |
          echo "Running health checks on production..."
          # curl -f https://api.example.com/health || exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "Production deployment successful!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deployment failed!"
